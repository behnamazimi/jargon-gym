# Separate from CI so a failed production push cannot fail check/build/test
# or the local migration dry-run. Runs after CI succeeds on main, and can
# be re-run by hand if a push fails.
name: Deploy Supabase migrations

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: supabase-deploy
      cancel-in-progress: false
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Direct db.*.supabase.co is IPv6-only; GitHub-hosted runners get
      # ECONNREFUSED there. Session pooler is IPv4. supabase link is not
      # used: it needs a Management API token with org privileges, and
      # SUPABASE_ACCESS_TOKEN does not have those.
      - name: Push pending migrations
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            db_url="$SUPABASE_DB_URL"
          elif [ -n "$SUPABASE_DB_PASSWORD" ]; then
            encoded="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')"
            db_url="postgresql://postgres.ovdmwphqpttcscnjfmfp:${encoded}@aws-0-eu-central-1.pooler.supabase.com:5432/postgres?sslmode=require"
          else
            echo "::error::Set GitHub secret SUPABASE_DB_URL (session pooler URI) or SUPABASE_DB_PASSWORD."
            exit 1
          fi
          pnpm supabase db push --yes --db-url "$db_url"
