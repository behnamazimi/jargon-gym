name: Set up web tooling
description: pnpm, Node from .nvmrc and the locked dependencies, for jobs that run the Capacitor CLI.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
